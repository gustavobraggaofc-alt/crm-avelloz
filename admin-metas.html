<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Avelloz - Metas</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <div class="header__brand">
        <div class="header__logo">A</div>
        <div class="header__title">
          CRM AVELLOZ
          <small>SISTEMA DE VENDAS</small>
        </div>
      </div>
      <div class="header__user">
        <span>Olá, Admin</span>
        <div class="header__avatar">AD</div>
      </div>
    </header>

    <!-- MENU LATERAL -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- CONTEÚDO -->
    <main class="main">
      <div class="page-header">
        <div>
          <p class="breadcrumb">Administração / <strong>Metas</strong></p>
          <h1>Metas</h1>
          <p>Defina metas mensais de vendas por vendedor</p>
        </div>
        <div class="toolbar">
          <select>
            <option>Junho/2026</option>
            <option>Maio/2026</option>
            <option>Abril/2026</option>
          </select>
        </div>
      </div>

      <!-- TABELA DE METAS -->
      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Vendedor</th>
              <th>Vendas no Mês</th>
              <th>Meta Atual</th>
              <th>% Atingido</th>
              <th>Nova Meta (R$)</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-metas">
            <!-- preenchido via JS -->
          </tbody>
        </table>
      </section>
    </main>

    <!-- RODAPÉ -->
    <footer class="footer">
      <span>© 2026 Avelloz Motos - CRM de Vendas</span>
      <a href="#">Suporte</a>
    </footer>

  </div>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script>
    async function renderizarMetas() {
      const tbody = document.getElementById("lista-metas");
      const vendedores = await API.listarVendedores();
      tbody.innerHTML = "";

      vendedores.forEach((v) => {
        const vendas = v.vendas_mes || 0;
        const meta = v.meta || 1;
        const percentual = Math.round((vendas / meta) * 100);
        const corBarra = percentual >= 100 ? "var(--sucesso)" : "var(--azul-primario)";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${v.nome}</td>
          <td>${formatarMoeda(vendas)}</td>
          <td>${formatarMoeda(v.meta || 0)}</td>
          <td>
            <div class="progress" style="width:120px; display:inline-block; vertical-align:middle; margin-right:8px;">
              <div class="progress__bar" style="width: ${Math.min(percentual, 100)}%; background:${corBarra};"></div>
            </div>
            ${percentual}%
          </td>
          <td>
            <input type="number" value="${v.meta || 0}" data-id="${v.id}" class="input-meta" style="width:140px; border:1px solid var(--borda); border-radius:8px; padding:8px 10px; font-size:13px;" />
          </td>
          <td>
            <button class="btn btn--ghost" data-id="${v.id}" data-acao="salvar">Salvar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("lista-metas").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-acao='salvar']");
      if (!btn) return;

      const id = Number(btn.dataset.id);
      const input = document.querySelector(`.input-meta[data-id="${id}"]`);
      const novaMeta = Number(input.value) || 0;

      await API.atualizarVendedor(id, { meta: novaMeta });
      await renderizarMetas();
    });

    renderizarMetas();
  </script>
</body>
</html>
