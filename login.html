<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CRM Avelloz - Entrar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="header__logo">A</div>
      <h1>CRM Avelloz</h1>
      <p>Sistema de Vendas - faça login para continuar</p>

      <form id="form-login">
        <p class="login-erro" id="login-erro" hidden></p>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@avelloz.com" required />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn--primary">Entrar</button>
      </form>

      <div class="login-card__footer">
        © 2026 Avelloz Motos
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script>
    const formLogin = document.getElementById("form-login");
    const erroLogin = document.getElementById("login-erro");
    const botaoLogin = formLogin.querySelector("button");

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      erroLogin.hidden = true;
      botaoLogin.disabled = true;

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      try {
        await API.login({ email, senha });
        window.location.href = "index.html";
      } catch (erro) {
        erroLogin.textContent = erro.message;
        erroLogin.hidden = false;
        botaoLogin.disabled = false;
      }
    });
  </script>
</body>
</html>
